retention:
  checkpoints: validation-best checkpoint per completed run under experiments/gla_key_dimension/runs/<run_id>/checkpoints/<step>/
  logs: one successful Slurm log per run under experiments/gla_key_dimension/runs/<run_id>/training.log
execution_policy:
  hardware: "4\xD7B300 (akita) or 4\xD7H100 (dogo, mastiff) per run in the sweep partition, one Python\
    \ process, global batch 256 as 4 accumulation steps of 64; acceptance keyed to the allocated type"
  excluded_hardware: 'A100/A6000: not qualified for the fused GLA kernel'
  runtime_settings:
    CUDA_HOME: <environment>/site-packages/nvidia/cuda_nvcc, so jaxlib assembles the bridge's Triton PTX
      with the locked CUDA 12.9 ptxas instead of a node's system toolkit
    XLA_FLAGS: --xla_gpu_enable_command_buffer= (the Triton custom-call bridge runs outside command buffers)
    EJKERNEL_TRITON_CACHE_DIR: <artifact_root>/.cache/gla_key_dimension/triton
    TRANSFORMER_HOST_STAGING: 0 (direct H100 transfers)
  attention_backend: fused (chunked Triton), pinned in every recipe
  acceptance: 'per GPU type and source/config/runtime identity: GLA CPU tests, fused-kernel GPU tests,
    initialization hash, 20-update full-recipe pilot, and exact fresh-process resume at update 21'
  kernel_operands: Q, K, V, and the output cotangent enter the Triton kernels as FP32. With BF16 operands
    upcast in-kernel, Triton 3.6 on sm_103 (B300) ran FP32 IEEE products at TF32-level precision (4e-4
    relative output error vs 1e-7 on H100); FP32 operands fix this without changing the arithmetic.
  runtime_settings_resolved:
    CUDA_HOME: .envs/shared_transformer/lib/python3.11/site-packages/nvidia/cuda_nvcc
    NCCL_P2P_DISABLE: null
    TRANSFORMER_HOST_STAGING: '0'
    XLA_FLAGS: ' --xla_gpu_enable_command_buffer='
    XLA_PYTHON_CLIENT_ALLOCATOR: null
    XLA_PYTHON_CLIENT_MEM_FRACTION: null
    XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
  submission: sweep partition, 4 GPUs (B300 or H100 resolved per allocation), through the experiment's
    Kennel launcher at the source commit; the README gives the equivalent current command
