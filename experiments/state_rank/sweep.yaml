tolerance_amendment:
  parameter: NORMALIZED_SPECTRUM_ATOL in scaffolds/state_rank/compare_random.py
  previous: 2.0e-05
  current: 5.0e-05
  commit: 279fdd63fa03054196762da2bc616eb1f8c30208
  scope: Llama pretrained baseline reproduction only; the DeltaNet threshold stays
    2e-5
  reason: The retained baseline was measured on L40S. The Kennel H100 pretrained measurement
    reached 2.0576e-5 (input 1) with zero discrete-rank mismatches and 1e-6 K/V agreement.
  decision: user-approved on 2026-09-24 before resubmission
cross_cluster_reproduction:
  random_vs_pretrained:
    summary_rows: 96
    discrete_ranks: threshold, 90%- and 99%-energy ranks identical in all rows
    continuous_max_relative_difference:
      participation_ratio: 3.7e-06
      log_trace: 3.3e-07
      key_and_value_norms: 3.0e-07
    parameter_fingerprints: identical to ORCD for all six conditions
    inputs: identical
  random_vs_pretrained_deltanet:
    summary_rows: 144
    discrete_ranks: energy ranks identical in all rows; threshold rank identical in
      143
    threshold_rank_difference:
      condition: random-seed1
      layer: 23
      orcd: 78.46875
      kennel: 78.5
      meaning: one of 32 input/head states gains one mode at the 1e-4 sigma_1 cutoff
    continuous_max_relative_difference:
      participation_ratio: 5.6e-07
      log_trace: 5.6e-07
    parameter_fingerprints:
      pretrained: identical to ORCD
      random: differ from ORCD in all five seeds
      cause: CPU-vendor-dependent last-bit rounding of log/exp/expm1 in FLA's A_log
        and dt_bias initialization; every other parameter is bit-identical
      evidence:
      - Seed 0 on AMD EPYC (dogo, jobs 201752-201754) gives the Kennel fingerprint
        under every ATen CPU capability (default, AVX2, AVX512), MKL_CBWR (COMPATIBLE,
        SSE4_2, AVX2, AVX512), MKL_DEBUG_CPU_TYPE=5, a dirtied allocator, and OMP_NUM_THREADS=1.
      - Seed 0 on Intel Xeon Gold 5218R (doodle, job 201762) reproduces the ORCD fingerprint
        0415b698...0c65bd exactly.
      - 'Seeds 0-4, Intel (doodle, 201763) versus AMD (mastiff, 201764; bit-identical
        to dogo for seed 0): 10-22 of 384 A_log/dt_bias elements per seed differ,
        each by 1 ULP.'
      consequence: random DeltaNet metrics deviate from ORCD no more than the pretrained
        condition, whose parameters are identical (both <=5.6e-7 relative)
  unified_analysis:
    depth_summary_rows: 240
    differences: only the DeltaNet random-seed1 layer-23 threshold rank above; terminal
      comparison counts unchanged
superseded_execution:
  home_cluster: ORCD/Engaging
