schema_version: 1
opened: '2026-10-31'
question: How do key width d_K and degree m shape validation perplexity for tanh query
  coefficients with a decayed projection W in Transformer++?
settings:
  metric: validation-best perplexity (terminal reported separately)
  grid:
    qk_head_dim:
    - 8
    - 16
    - 32
    - 64
    attention_degree:
    - 2
    - 4
    - 8
    - 12
  fixed: 14 heads, value_head_dim 64, canonical QK RMSNorm with per-head scale, head
    RMSNorm output, Mosaic, 7,570 updates of 256 sequences
  existing_cell: d_K = 64, m = 4 is query-m4-w-decay rca97cc9db8f2, the same recipe
  narrow_keys:
    question: 'Does the key-width penalty hold for exp, softmax and the softplus-prefactor
      SoS kernel, and which ingredient matters at narrow keys: the polynomial form,
      learned coefficients or their input dependence?'
    metric: validation-best perplexity (terminal reported separately)
    degree: 8
    qk_head_dim:
    - 4
    - 8
    - 16
    - 64
    columns:
    - softplus_times_sos
    - exp
    - softmax
    - taylor
    - static
    - query
    query_column: narrow_query_dk4, then the grid's query_decay_dk8_m8, query_decay_dk16_m8
      and query_decay_dk64_m8
    exact_evaluation: 'narrow_exp_dk4, _dk8 and _dk16 use attention_exp_shift: row_max;
      narrow_softplus_times_sos_dk4, narrow_taylor_dk4 and narrow_taylor_dk8 use attention_head_rms_prescale:
      max_abs'
    plain_evaluation: the plain_* roles are the same recipes without the row shift
      or the prescale
    heatmap: plot.py reads the query_decay_* roles only
