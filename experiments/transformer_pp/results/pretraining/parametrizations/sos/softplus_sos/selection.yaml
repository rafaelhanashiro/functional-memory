question: Does softplus composed with query SoS improve Transformer++ performance,
  and does retaining a learned negative-tail baseline help?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal
  shape:
    num_layers: 15
    hidden_size: 896
    num_heads: 14
  primary_total_degrees:
  - 8
  - 9
  - 12
  - 13
  training_updates: 7570
  training_context: 2048
  batch_size: 256
  seed: 42
  positional_encoding: rope
  coefficient_projection_weight_decay: 0.1
  backend: mosaic
  primary_initialization: Each degree-matched pair shares identical parameter arrays;
    h=T_m, with weights h(softplus(s)) or softplus(s)*h(softplus(s)).
  limits: The prefactor changes total degree and initial kernel; the direct-softplus
    control starts its constant coefficient at zero; hardware/backend differences
    follow execution records.
  sos_core_degrees:
  - 8
  - 12
  single_head_parameters:
    roles:
      primary_softplus_times_sos: 8
      primary_softplus_times_sos_m12: 12
    layer_index: 7
    head_index: 0
    selection_rule: Same middle layer and first head as the original SoS parameter
      figure; chosen before inspecting these histories.
    fields:
      a: modulation_amplitude
      b: projection_bias
      w_l2: projection_kernel_l2
    w_norm:
      input_dimension: 896
      convention: Euclidean norm over input channels; no saved step-zero norm
    coordinate_convention: U_0,...,U_(m/2),V_0,...,V_(m/2-1); m is the core degree,
      total degree m+1
    scaling: Raw generator parameters; no factorial or Taylor-factor rescaling
    initialization: Analytic a=0,b=1 markers; recorded curves begin at update 100
    coefficient_input_normalization: none
