question: Does the better-performing SoS query model have less tanh saturation than
  regular query in the same selected middle-layer head?
settings:
  layer_index: 7
  head_index: 0
  checkpoint_step: 7500
  sequences: 1
  prediction_tokens: 2048
  input_dimension: 896
  sample_selection: first_heldout_sequence
  sample_record_sha256: 26d5803c7dc95fe7f5dd7015ae4195205246bda089792b2e0f478a29398df8a6
  saturation_absolute_tanh_threshold: 0.99
  mostly_saturated_token_fraction_threshold: 0.9
  saturation_convention: fraction of tokens with abs(tanh(W^T x)) >= 0.99; positive
    and negative tails plotted separately
  aggregation_convention: each query token and generator coordinate has equal weight;
    not weighted by amplitude, polynomial contribution or output sensitivity
  projection_convention: x is the actual gain-applied pre-attention RMSNorm output;
    no inner tanh bias
  coordinate_convention: 'direct: r=0..m; sum_of_squares: U0..U(m/2), V0..V(m/2-1)'
  limits: one selected head, validation-best checkpoint and held-out sequence; descriptive
    mechanism comparison, not a causal explanation of perplexity
