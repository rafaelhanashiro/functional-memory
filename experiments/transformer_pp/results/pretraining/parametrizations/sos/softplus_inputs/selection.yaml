question: Does evaluating the tanh query polynomial at softplus(s) in place of the
  score s improve it at the reference shape at degrees eight and twelve?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal at the last update
  shape:
    name: reference
    layers: 15
    width: 896
    heads: 14
    training_steps: 7570
    warmup_steps: 455
    global_batch_size: 256
  training_context: 2048
  seed: 42
  degrees:
  - 8
  - 12
  kernel: W(t,i) = sum_(r=0..m) c_r(x_t) z_ti^r, z_ti = phi(s_ti), s_ti = Q_t K_i^T
    / sqrt(d_K), with m the degree
  transform:
    softplus: z = log(1 + exp(s)); b_0 starts at 0, so the kernel starts at sum_(r=1..m)
      z^r/r!, the Taylor polynomial of e^z - 1 = e^s
  allowed_differences:
  - model.attention_score_transform
  - model.attention_coefficient_constant_initial (0)
  - train.gradient_event_capture and its policy fields (defaults)
  backend: primaries on the Mosaic transformed query-polynomial kernels (H100), their
    controls on B300's Mosaic query-polynomial kernels, the exp reference on B300's
    fused Triton kernels, fixed Taylor at degree eight on H100's Mosaic query-polynomial
    kernels and fixed Taylor at degree twelve on the Mosaic query-polynomial kernels
    (B300 to update 1500, then H100); diagnostics on the forward-only blocked scan
  decision: a primary counts as a win only if its validation-best perplexity beats
    its control's by at least 0.5% (14.251 or below against 14.323 at degree eight
    and 14.155 or below against 14.226 at degree twelve); seed noise is about 0.1-0.2%.
    Each is also compared with exp (14.257) and fixed Taylor at its degree (14.218;
    14.309), the degree-twelve primary with the degree-eight one (14.262)
  comparison_groups:
    reference_rope_w_decay:
    - control_query_m8_rope_w_decay
    - primary_query_m8_rope_w_decay_softplus_input
    - reference_exp
    - reference_fixed_taylor_m8
    reference_rope_w_decay_m12:
    - control_query_m12_rope_w_decay
    - primary_query_m12_rope_w_decay_softplus_input
    - primary_query_m8_rope_w_decay_softplus_input
    - reference_exp
    - reference_fixed_taylor_m12
