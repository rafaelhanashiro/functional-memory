question: Do per-degree signed score biases, (s_ti + beta_r)^r for orders r = 1..8,
  improve the degree-eight tanh query polynomial with RoPE and coefficient-W decay
  at the 12-layer width-640 shape?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal at the last update
  shape:
    layers: 12
    width: 640
    heads: 10
    training_steps: 7551
    warmup_steps: 454
    global_batch_size: 128
  training_context: 2048
  seed: 42
  degree: 8
  kernel: W(t,i) = c_0(x_t) + sum_(r=1..8) c_r(x_t) (s_ti + beta_r(t,i))^r
  score_bias_modes:
    static: beta_r = b_r
    query: beta_r = b_r + a_r tanh(u_r x_t)
  initialization: b = 0, a = 1, u = 0 (zero shift); u decays, b and a do not
  allowed_differences:
  - model.attention_score_bias
  - train.gradient_event_capture and its policy fields (defaults)
  backend: trials on the H100 Mosaic score-bias kernels (row shift); the control on
    the B300 Mosaic query-polynomial kernels; diagnostics on the forward-only blocked
    scan
  decision: a trial clears the bar only if its validation-best perplexity beats the
    control's 17.592 by clearly more than seed noise, taken as about 0.25% (below
    about 17.548)
  comparison_groups:
    trial_rope_w_decay_l12_d640:
    - control_query_m8_rope_w_decay_l12_d640
    - trial_query_m8_rope_w_decay_l12_d640_static_biases
    - trial_query_m8_rope_w_decay_l12_d640_query_biases
runs:
