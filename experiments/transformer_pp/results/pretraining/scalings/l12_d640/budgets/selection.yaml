question: How do the attention variants compare at the 12-layer width-640 shape as
  its token budget grows? At twice its 1x budget, the reference shape's token count,
  the variants at degrees eight and twelve against exp, their 1x runs at this shape
  and the reference shape at the same tokens; at four times the budget, the five degree-twelve
  RoPE polynomials and softmax against exp and their 2x runs.
