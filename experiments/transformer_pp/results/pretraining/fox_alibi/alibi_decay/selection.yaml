schema_version: 1
opened: '2026-10-29'
question: 'Does a constant ALiBi-style decay per head, without RoPE, match the token-dependent
  forget gate without RoPE in 1× pretraining: with learned slopes on degree-four tanh
  query attention, and as ALiBi with fixed slopes on softmax and exp? How much of
  the gap does an input-dependent slope per query token (query-distance gates) close
  on softmax and exp, and what does a rate that also reads the key token (a query-key
  gate) add on exp, as the matched baseline for the per-order query-key polynomial
  gates? Does a learned input-free distance gate, shared or per order, help learned
  static coefficients without RoPE at degrees four and eight?'
settings:
  metric: validation_perplexity
  primary_comparison: terminal held-out PPL at update 7,570; validation-best reported
    separately
  shared_recipe: zero-amplitude tanh query coefficients, canonical QK RMSNorm with
    per-head scaling, head RMSNorm output scaling, blocked reference backend, no positional
    encoding, 1× Chinchilla (7,570 updates of 256 sequences)
  difference: attention_forget_gate_form constant (log alpha_t = -exp(A_h), ALiBi
    slopes at initialization) against input (Gated DeltaNet's gate)
  static_gate_metric: validation-best held-out PPL; terminal PPL at update 7,570 reported
    separately
  static_gate_recipe: learned static per-head coefficients stored factorial-scaled
    (Taylor start), canonical QK RMSNorm with per-head scaling, head RMSNorm output
    scaling, Mosaic kernels, 1× Chinchilla (7,570 updates of 256 sequences)
  static_gate_difference: positional_encoding none and the input-free query-distance
    gate (attention_forget_gate_conditioning none, lambda = exp(A_log) softplus(dt_bias)
    per layer and head, or per layer, head and order) against the RoPE static controls;
    each per-order run against its shared-gate run; each against the query-distance
    gate of the same degree and sharing
  shared_recipe_softmax_exp: 'the no-RoPE forget-gate recipes of softmax (r5adc29a91e3b)
    and exp with head RMSNorm output scaling (r183f08346ddc): canonical QK RMSNorm
    with per-head scaling, blocked backend, no positional encoding, 1× Chinchilla
    (7,570 updates of 256 sequences)'
  difference_softmax_exp: attention_forget_gate_form constant with attention_forget_gate_constant_rate
    fixed (score bias -m_h (t - i), m_h = 2^(-8 h / 14) in every layer, no parameters)
    against input (Gated DeltaNet's gate); the primaries train on the causal strips,
    the controls trained on the scan
  difference_query_distance: attention_forget_gate_mode query_distance (score bias
    (t - i) log alpha_t, the query token's own rate times the distance) against cumulative
    (L_t - L_i), with the same gate parameters and initialization; the primaries train
    on the causal strips, the controls trained on the scan
  difference_query_key: attention_forget_gate_conditioning query_key (pair rate lambda_ti
    = exp(A_log) softplus(w_alpha . x_t + w_k . x_i + b_dt), score bias (t - i) log
    alpha_ti) against query on the exp query-distance recipe; w_k (188,160 parameters)
    starts at zero, so the primary starts exactly as the query-distance primary
