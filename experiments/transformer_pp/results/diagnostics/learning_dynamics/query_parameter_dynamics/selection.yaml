question: How do the regular query-polynomial generator parameters evolve in one middle-layer
  head?
settings:
  model_shape:
    num_layers: 15
    hidden_size: 896
    num_heads: 14
  layer_index: 7
  head_index: 0
  selection_rule: middle layer and first head, fixed before inspecting these parameter
    histories
  parameter_fields:
    a: modulation_amplitude
    b: projection_bias
    w_l2: projection_kernel_l2
  coordinate_convention: actual polynomial orders r=0,...,m
  coefficient_formula: c_r(x) = (b_r + a_r tanh(W_r^T x)) / r!
  parameter_convention: raw learned a and b; both are divided by r! inside attention
  initialization: analytic a=0 and b=1; no saved step-zero measurement or W norm
  w_norm_convention: Euclidean norm of each 896-dimensional W vector, over input channels
  snapshots: 28
  first_step: 100
  terminal_step: 7570
  coefficient_sample: same first held-out sequence; 2048 query tokens at every evaluation
  derived_tanh_moments:
    mean: (r! mean(c_r) - b_r) / a_r
    std: r! std(c_r) / abs(a_r)
    minimum_absolute_amplitude: 1.0e-08
    undefined: empty CSV fields when amplitude is too small
    limits: inferred from rounded coefficient summaries on the fixed diagnostic sample,
      not direct activation measurements
  comparisons: closed training-behavior diagnostic only; no mechanism ranking
