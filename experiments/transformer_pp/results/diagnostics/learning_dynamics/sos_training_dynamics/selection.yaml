question: Are the completed Transformer++ sum-of-squares query-polynomial runs stable
  during training, and how do their effective coefficients evolve?
settings:
  model_shape:
    num_layers: 15
    hidden_size: 896
    num_heads: 14
  gradient_scope: global norm before clipping; window statistics cover every optimizer
    update
  late_training_start_exclusive: 1500
  coefficient_field: attention_diagnostics.coefficients.effective_summary
  coefficient_sample: same first held-out sequence; 2048 query tokens per evaluation
  coefficient_convention: p_t(s) = sum_r c_r(x_t) s^r; c_r already include factorial
    order scaling
  terminal_step: 7570
  single_head_parameters:
    layer_index: 7
    head_index: 0
    selection_rule: middle layer and first head, fixed before inspecting parameter
      histories
    fields:
      a: modulation_amplitude
      b: projection_bias
      w_l2: projection_kernel_l2
    w_norm:
      convention: Euclidean norm of each W vector over the input-channel axis
      input_dimension: 896
      initialization: no saved step-zero norm; individual Gaussian draws have different
        initial norms
    coordinate_convention: U_0,...,U_(m/2),V_0,...,V_(m/2-1); factor powers, not expanded
      polynomial orders
    scaling: raw learned parameters; no factorial or Taylor-factor rescaling
    initialization: analytic a=0 and b=1; no saved step-zero measurement
  comparisons: training behavior of the selected SoS runs only; no mechanism ranking
runs:
- study: transformer_pp
  run_id: reeefbcc19abf
  role: sos_m8
  degree: 8
