question: Does softplus composed with query SoS improve Transformer++ performance,
  and does retaining a learned negative-tail baseline help? How do the two degree-twelve
  compositions compare with exp and the other polynomials at the 12-layer width-640
  shape at 1x, 2x and 4x its 1x budget?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal
  shape:
    num_layers: 15
    hidden_size: 896
    num_heads: 14
  primary_total_degrees:
  - 8
  - 9
  - 12
  - 13
  training_updates: 7570
  training_context: 2048
  batch_size: 256
  seed: 42
  positional_encoding: rope
  coefficient_projection_weight_decay: 0.1
  backend: mosaic
  primary_initialization: Each degree-matched pair shares identical parameter arrays;
    h=T_m, with weights h(softplus(s)) or softplus(s)*h(softplus(s)).
  limits: The prefactor changes total degree and initial kernel; the direct-softplus
    control starts its constant coefficient at zero; hardware/backend differences
    follow execution records.
  sos_core_degrees:
  - 8
  - 12
  single_head_parameters:
    roles:
      primary_softplus_times_sos: 8
      primary_softplus_times_sos_m12: 12
    layer_index: 7
    head_index: 0
    selection_rule: Same middle layer and first head as the original SoS parameter
      figure; chosen before inspecting these histories.
    fields:
      a: modulation_amplitude
      b: projection_bias
      w_l2: projection_kernel_l2
    w_norm:
      input_dimension: 896
      convention: Euclidean norm over input channels; no saved step-zero norm
    coordinate_convention: U_0,...,U_(m/2),V_0,...,V_(m/2-1); m is the core degree,
      total degree m+1
    scaling: Raw generator parameters; no factorial or Taylor-factor rescaling
    initialization: Analytic a=0,b=1 markers; recorded curves begin at update 100
    coefficient_input_normalization: none
  l12_d640:
    shape:
      num_layers: 12
      hidden_size: 640
      num_heads: 10
    batch_size: 128
    training_context: 2048
    validation_batches: 38
    budgets:
      1x:
        training_updates: 7551
        warmup_steps: 454
        validation_best_step: 7551
      2x:
        training_updates: 15103
        warmup_steps: 908
        validation_best_step: 15000
      4x:
        training_updates: 30205
        warmup_steps: 1815
        validation_best_step: 30205
    baseline:
      1x: reference_exp_l12_d640_1x
      2x: reference_exp_l12_d640_2x
      4x: reference_exp_l12_d640_4x
    comparison_groups:
      1x:
      - primary_softplus_times_sos_m12_l12_d640_1x
      - primary_softplus_sos_m12_l12_d640_1x
      - control_softplus_m8_l12_d640_1x
      - control_query_m8_l12_d640_1x
      - reference_exp_l12_d640_1x
      2x:
      - primary_softplus_times_sos_m12_l12_d640_2x
      - primary_softplus_sos_m12_l12_d640_2x
      - control_sos_m12_l12_d640_2x
      - control_softplus_m12_l12_d640_2x
      - reference_exp_l12_d640_2x
      4x:
      - primary_softplus_times_sos_m12_l12_d640_4x
      - primary_softplus_sos_m12_l12_d640_4x
      - control_sos_m12_l12_d640_4x
      - control_softplus_m12_l12_d640_4x
      - reference_exp_l12_d640_4x
    reference_shape_contrast:
    - primary_softplus_times_sos_m12
    - primary_softplus_sos_m12
    - reference_exp
    same_fraction:
      description: gap at the 1x update s, the 2x update 2s and the 4x update 4s,
        each against exp at its budget or the prefactor run against the run without
        it; every evaluation uses the same validation batches
      one_x_steps:
      - 1500
      - 3000
      - 4500
      - 6000
      - 7551
      two_x_steps:
      - 3000
      - 6000
      - 9000
      - 12000
      - 15103
      four_x_steps:
      - 6000
      - 12000
      - 18000
      - 24000
      - 30205
    gradient_statistics:
      description: per primary, from its metrics.jsonl gradient windows, the largest
        global gradient norm before clipping and the share of updates above the clip
        norm 1.0, over all updates and from the first evaluation after warmup; spikes
        are norms above five times the median of the preceding 100 updates
      after_warmup_from_update:
        1x: 500
        2x: 1000
        4x: 2000
    backend: the six primaries and degree-twelve direct softplus on the Mosaic transformed
      (softplus) query-polynomial kernels, raw-score SoS and degree-eight direct query
      on the Mosaic query-polynomial kernels, degree-eight direct softplus on the
      blocked backend's causal strips, exp on fused Triton
    limits: One seed; the primaries trained only on dogo's H100 SXM, several comparison
      runs partly or wholly on other GPUs (each record's attempts); no degree-twelve
      raw-score SoS or direct softplus run exists at 1x at this shape.
