question: Does removing the constant throughout training improve softplus-input query,
  static, and SoS polynomials at degree eight?
settings:
  degree: 8
  score_transform: softplus
  coefficient_input_normalization: none
  positional_encoding: rope
  weight_decay: 0.1
  query_projection_weight_decay: true
  query_amplitude_bias_weight_decay: false
  static_coefficient_weight_decay: false
  direct_constant_policy: c0 structurally absent; learn r1..r8
  sos_constant_policy: U0 and V0 structurally absent before square expansion; learn
    U1..U4,V1..V3; expanded c0=c1=0
  input_power: 0
  initialization: retain the parent nonconstant coordinates, including exact surviving
    W draws
  ppl_metrics:
  - validation-best
  - terminal
  limitations:
  - One seed (42).
  - Static parent also differs in score transform; no completed static softplus learned-constant
    control exists.
  - Prefactor control has total degree nine; zero-constant SoS has total degree eight.
  - Removing SoS factor constants changes higher expanded coefficients at initialization;
    it is not T8 minus its constant.
runs:
- study: transformer_pp
  run_id: rb5b604ae829a
  role: zero_constant_query
  label: Query, softplus, c0=0
  sources:
    config.yaml:
      path: experiments/transformer_pp/runs/rb5b604ae829a/config.yaml
