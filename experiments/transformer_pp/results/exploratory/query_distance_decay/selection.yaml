question: Can endpoint query-key dependence or a bounded positive rate improve query-dependent
  distance decay without intervening gates?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal at update 7570
  control_decay: product of alpha_j for j from i+1 through t
  query_decay: exp(-(t-i) * lambda_t)
  training_steps: 7570
  training_context: 2048
  seed: 42
  query_key_decay: exp(-(t-i)*a_h*softplus(w_q,h*x_t+w_k,h*x_i+b_h))
  bounded_query_decay: exp(-(t-i)*a_h*sigmoid(w_q,h*x_t+b_h))
  allowed_mathematical_changes:
  - model.attention_forget_gate_mode
  - model.attention_forget_gate_conditioning
  - model.attention_forget_gate_rate_activation
runs:
