question: Do per-degree signed score biases, (s_ti + beta_r)^r for orders r = 1..8,
  improve the degree-eight tanh query polynomial with RoPE and with per-order query-key
  distance gates?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal at update 7570
  training_steps: 7570
  training_context: 2048
  global_batch_size: 256
  seed: 42
  degree: 8
  kernel: W(t,i) = c_0(x_t) G_0(t,i) + sum_(r=1..8) c_r(x_t) G_r(t,i) (s_ti + beta_r(t,i))^r
  gate: G_r = 1 (RoPE control) or exp(-(t-i) exp(A_r) softplus(w_q,r x_t + w_k,r x_i
    + dt_bias_r)) (per-order query-key gate control, no positional encoding)
  score_bias_modes:
    static: beta_r = b_r
    query: beta_r = b_r + a_r tanh(u_r x_t)
    query_key: beta_r = b_r + a_r tanh(u_r x_t + v_r x_i)
  initialization: b = 0, a = 1, u = v = 0 (zero shift); u and v decay, b and a do
    not
  allowed_differences:
  - model.attention_score_bias
  - train.gradient_event_capture and its policy fields (defaults)
  - model.attention_backend (blocked; controls mosaic) and model.attention_blocked_implementation
    (strips; controls scan)
  backend: primaries on the blocked backend's causal strips; both controls on the
    Mosaic kernels; diagnostics on the forward-only blocked scan
  comparison_groups:
    rope_w_decay:
    - control_query_m8_rope_w_decay
    - primary_query_m8_rope_w_decay_static_biases
    - primary_query_m8_rope_w_decay_query_biases
    - primary_query_m8_rope_w_decay_query_key_biases
    per_order_query_key_gate_nope_w_decay:
    - control_query_m8_per_order_query_key_gate_nope_w_decay
    - primary_query_m8_per_order_query_key_gate_nope_w_decay_static_biases
    - primary_query_m8_per_order_query_key_gate_nope_w_decay_query_biases
    - primary_query_m8_per_order_query_key_gate_nope_w_decay_query_key_biases
