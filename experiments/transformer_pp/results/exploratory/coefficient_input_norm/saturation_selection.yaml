question: Where do query, SoS, and softplus-times-SoS coefficient generators saturate
  at core degrees 8 and 12, and how do available L2 variants compare?
settings:
  layer_index: 7
  head_index: 0
  checkpoint_step: 7500
  ppl_metric: validation-best
  sequences: 1
  prediction_tokens: 2048
  input_dimension: 896
  sample_selection: first_heldout_sequence
  sample_record_sha256: 26d5803c7dc95fe7f5dd7015ae4195205246bda089792b2e0f478a29398df8a6
  saturation_absolute_tanh_threshold: 0.99
  head_y_limits_percent:
  - 0
  - 100
  all_heads_y_limits_percent:
  - 0
  - 0.25
  bar_color: '#28699b'
  head_aggregation: fraction of sampled tokens per generator coordinate in layer 8,
    head 1
  all_heads_aggregation: mean token saturation per generator coordinate over all layers
    and heads; equal weight, not contribution weighted
  coordinate_convention: 'direct: r=0..m; SoS: U0..U(m/2), V0..V(m/2-1), before square
    expansion'
  degree_convention: m is the SoS core degree; softplus-times-SoS total degree is
    m+1
  missing_convention: Not run; never interpreted as zero
  limits: One held-out sequence. Original controls have only the selected-head probe;
    all-head panels contain L2 runs only. Raw L2 m=8 runs do not exist. Neither L2
    placement has been run for softplus-times-SoS.
