question: Does coefficient-input L2 normalization improve direct and SoS query polynomials
  at m=8 and m=12, including softplus-times-SoS prefactor models, and does bypassing
  the pre-attention RMSNorm gains change the outcome?
opened: '2026-11-14'
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal
  seed: 42
  training_steps: 7570
  comparison: Post-RMSNorm L2 runs against their original-input controls; raw-input
    L2 m=12 runs against completed post-RMSNorm L2 controls; raw-input L2 softplus-times-SoS
    runs at core degrees 8/12 (total degrees 9/13) against their original-input prefactor
    parents.
  diagnostics: fixed first held-out sequence at scheduled evaluations; all layer/head/generator
    coordinates
  saturation_absolute_tanh_threshold: 0.99
  normalization_formula: u / max(norm(u,2),1e-6), only before coefficient projection;
    u is the source declared by each recipe (post-RMSNorm by default, pre-RMSNorm
    for raw-input L2).
  open_decision: Six earlier L2 runs completed. Raw-input L2 improves on post-RMSNorm
    L2 at m=12 but remains behind the original-input controls. Two raw-input L2 softplus-times-SoS
    prefactor runs are submitted for acceptance and training at core degrees 8/12; determine whether
    they improve their original-input parents. Keep the original input as default
    pending those results.
  degrees:
  - 8
  - 12
