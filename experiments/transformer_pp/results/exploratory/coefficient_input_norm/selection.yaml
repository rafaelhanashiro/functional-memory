  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal
  seed: 42
  training_steps: 7570
  comparison: Post-RMSNorm L2 runs against their original-input controls; raw-input
    L2 m=12 runs against the explicitly selected completed post-RMSNorm L2 controls.
