schema_version: 1
opened: '2026-10-29'
question: 'Does a constant ALiBi-style decay per head, without RoPE, match the token-dependent
  forget gate without RoPE in 1× pretraining: with learned slopes on degree-four tanh
  query attention, and as ALiBi with fixed slopes on softmax and exp?'
settings:
  metric: validation_perplexity
  primary_comparison: terminal held-out PPL at update 7,570; validation-best reported
    separately
  shared_recipe: zero-amplitude tanh query coefficients, canonical QK RMSNorm with
    per-head scaling, head RMSNorm output scaling, blocked reference backend, no positional
    encoding, 1× Chinchilla (7,570 updates of 256 sequences)
  difference: attention_forget_gate_form constant (log alpha_t = -exp(A_h), ALiBi
    slopes at initialization) against input (Gated DeltaNet's gate)
  shared_recipe_softmax_exp: 'the no-RoPE forget-gate recipes of softmax (r5adc29a91e3b)
    and exp with head RMSNorm output scaling (r183f08346ddc): canonical QK RMSNorm
    with per-head scaling, blocked backend, no positional encoding, 1× Chinchilla
    (7,570 updates of 256 sequences)'
  difference_softmax_exp: attention_forget_gate_form constant with attention_forget_gate_constant_rate
    fixed (score bias -m_h (t - i), m_h = 2^(-8 h / 14) in every layer, no parameters)
    against input (Gated DeltaNet's gate); the primaries train on the causal strips,
    the controls trained on the scan
