question: Does evaluating the degree-eight tanh query polynomial at softplus(s) or
  |s| in place of the score s improve it at the 12-layer width-640 shape, and softplus
  at the reference shape?
study: transformer_pp
settings:
  metric: held-out validation perplexity
  report:
  - validation-best
  - terminal at the last update
  shape:
    name: 12-layer width-640
    layers: 12
    width: 640
    heads: 10
    training_steps: 7551
    warmup_steps: 454
    global_batch_size: 128
  reference_shape:
    name: reference
    layers: 15
    width: 896
    heads: 14
    training_steps: 7570
    warmup_steps: 455
    global_batch_size: 256
  training_context: 2048
  seed: 42
  degree: 8
  kernel: W(t,i) = sum_(r=0..8) c_r(x_t) z_ti^r, z_ti = phi(s_ti), s_ti = Q_t K_i^T
    / sqrt(d_K)
  transforms:
    softplus: z = log(1 + exp(s)); b_0 starts at 0, so the kernel starts at sum_(r=1..8)
      z^r/r!, the Taylor polynomial of e^z - 1 = e^s
    abs: z = |s|; the control's Taylor start
  allowed_differences:
  - model.attention_score_transform
  - 'model.attention_coefficient_constant_initial (softplus runs: 0)'
  - train.gradient_event_capture and its policy fields (defaults)
  - 'at the 12-layer width-640 shape only: model.attention_backend (blocked; control
    mosaic) and model.attention_blocked_implementation (strips; control scan)'
  backend: 12-layer width-640 primaries on the blocked backend's causal strips, their
    control on B300's Mosaic query-polynomial kernels, the exp reference on B300's
    fused Triton kernels; the reference-shape primary on the Mosaic transformed query-polynomial
    kernels (H100), its control on B300's Mosaic query-polynomial kernels, the exp
    reference on B300's fused Triton kernels and fixed Taylor on H100's Mosaic query-polynomial
    kernels; diagnostics on the forward-only blocked scan
  decision: a primary counts as a win only if its validation-best perplexity beats
    its control's by at least 0.5% (17.504 or below against 17.592 at the 12-layer
    width-640 shape, 14.251 or below against 14.323 at the reference shape); seed
    noise is about 0.1-0.2%. Each is also compared with exp at its shape (17.550;
    14.257), and the reference-shape primary with fixed Taylor at degree eight (14.218)
  comparison_groups:
    l12_d640_rope_w_decay:
    - control_query_m8_rope_w_decay_l12_d640
    - primary_query_m8_rope_w_decay_l12_d640_softplus_input
    - primary_query_m8_rope_w_decay_l12_d640_abs_input
    - reference_exp_l12_d640
    reference_rope_w_decay:
    - control_query_m8_rope_w_decay
    - primary_query_m8_rope_w_decay_softplus_input
    - reference_exp
    - reference_fixed_taylor_m8
runs:
