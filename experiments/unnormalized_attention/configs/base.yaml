# Canonical OFM 250M Transformer, removing only attention row normalization.
# Port source: 32ea743b7b3aed1d631116dfaa3c4b85101baf32.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /home/rafah/projects/ofm/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /home/rafah/projects/ofm/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000

model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 14
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_embeddings: false
  remat: false
  # Causal attention is exp(QK^T / sqrt(d_k)) V, with no row denominator.
  attention_backend: fused
  attention_normalization: false

optim:
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  # 21,935 * 256 * 2,048 = 11,500,257,280 prediction tokens.
  total_steps: 21935

train:
  seed: 0
  source_commit: auto
  dtype: bfloat16
  workdir: results/unnormalized_attention/250m-exp-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
  wandb_mode: disabled
  wandb_project: functional-memory-unnormalized-attention
  wandb_run_name: 250m-exp-seed0
