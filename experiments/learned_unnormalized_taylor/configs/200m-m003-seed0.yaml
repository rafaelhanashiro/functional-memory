# 200M Transformer matching the repository's 200M sweep controls, with no attention row
# normalization and a degree-3 polynomial kernel whose coefficients are all learned.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000

model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 10
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_embeddings: false
  remat: false
  # Causal attention is p(QK^T / sqrt(d_k)) V with unshifted scores and no row
  # denominator, where p(x) = sum_(r<=3) c_r x^r. Every coefficient, including the
  # constant, is learned per layer and head, starting at the Taylor value 1/r!.
  attention_backend: auto
  attention_degree: 3
  attention_normalization: false
  attention_coefficients: learned
  attention_coefficient_sharing: per_head

  qk_norm: false
optim:
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  # 19,074 * 256 * 2,048 = 10,000,269,312 prediction tokens.
  total_steps: 19074

train:
  seed: 0
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/learned_unnormalized_taylor/runs/200m-m003-seed0
  checkpoint_dir: experiments/learned_unnormalized_taylor/checkpoints/200m-m003-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
