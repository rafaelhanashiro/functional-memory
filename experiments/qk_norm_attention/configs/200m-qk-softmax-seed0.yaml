# 200M Transformer matching the repository's 200M softmax control (d_K = 64), with
# QK-norm cosine scores: s_ij = exp(gamma) cos(q_i, k_j), gamma learned per layer and
# head from log(sqrt(d_K)). Trains under the canonical selective weight-decay policy.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000

model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 10
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-06
  dropout: 0.0
  tie_embeddings: false
  remat: false
  # Exact softmax over cosine scores; the control's cuDNN path consumes the
  # pre-scaled unit queries and unit keys unchanged.
  attention_backend: fused
  attention_degree: null
  qk_norm: true
  qk_norm_sharing: per_head
  # null selects sqrt(qk_head_dim) = 8: logits in [-8, 8] at initialization.
  qk_norm_initial_scale: null
  qk_norm_eps: 1.0e-06

optim:
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  weight_decay_policy: exclude_embeddings_norms_biases_v1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  # 19,074 * 256 * 2,048 = 10,000,269,312 prediction tokens.
  total_steps: 19074

train:
  seed: 0
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/qk_norm_attention/runs/200m-qk-softmax-seed0
  checkpoint_dir: experiments/qk_norm_attention/checkpoints/200m-qk-softmax-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
