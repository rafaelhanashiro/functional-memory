scientific_change: Learned per-head polynomial kernels p_{l,h}(s) = sum_{r<=m} c_{l,h,r} s^r, m = 1-4,
  initialized at the Taylor values 1/r!, over QK-norm cosine scores s = exp(gamma_{l,h}) cos(q, k) with
  gamma learned per layer and head from log(sqrt(d_K)); run without row normalization (fused kernel) and
  with signed row-sum normalization (blocked reference, the first normalized learned polynomials in the
  repository); canonical selective weight decay
