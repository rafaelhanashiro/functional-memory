# 200M Transformer at d_K = 64 with row-normalized fixed Taylor attention of degree 1,
# p_1(s) = sum_(r<=1) s^r / r!, over QK-norm cosine scores, under the scaffold's current
# defaults (QK-norm and selective weight decay). The retained d_K = 64 grid recipe otherwise.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000
model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 10
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-06
  dropout: 0.0
  tie_embeddings: false
  remat: false
  attention_backend: fused
  attention_degree: 1
  # QK-norm cosine scores with per-head log scales from log(sqrt(d_K)), the scaffold default.
  qk_norm: true
  qk_norm_sharing: per_head
  qk_norm_initial_scale: null
  qk_norm_eps: 1.0e-06
optim:
  learning_rate: 0.0003
  min_learning_rate: 3.0e-05
  weight_decay: 0.1
  weight_decay_policy: exclude_embeddings_norms_biases_v1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  total_steps: 19074
train:
  seed: 0
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/normalized_taylor_rerun/runs/200m-m001-seed0
  checkpoint_dir: experiments/normalized_taylor_rerun/checkpoints/200m-m001-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
