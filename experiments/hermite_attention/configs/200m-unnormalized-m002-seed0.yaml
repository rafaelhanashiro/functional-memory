# Fixed standard-normal Hermite degree 2, unnormalized, 200M, seed 0.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000

model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 10
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_embeddings: false
  remat: false
  attention_backend: fused
  attention_degree: 2
  attention_normalization: false
  attention_coefficients: fixed
  # exp(1/2) sum_(r<=m) He_r(s)/r!, expanded into monomials c_0,...,c_m.
  attention_fixed_coefficients: [0.8243606353500641, 1.6487212707001282, 0.8243606353500641]

  qk_norm: false
optim:
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  weight_decay_policy: exclude_embeddings_norms_biases_v1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  # 19,074 * 256 * 2,048 = 10,000,269,312 prediction tokens.
  total_steps: 19074

train:
  seed: 0
  wandb_project: functional-memory
  wandb_entity: rafah-massachusetts-institute-of-technology
  wandb_group: hermite_attention
  wandb_run_name: 200m-unnormalized-m002-seed0
  wandb_dir: experiments/hermite_attention/logs/200m-unnormalized-m002-seed0/wandb
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/hermite_attention/runs/200m-unnormalized-m002-seed0
  checkpoint_dir: experiments/hermite_attention/checkpoints/200m-unnormalized-m002-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
