data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000
model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 15
  hidden_size: 896
  num_heads: 14
  num_kv_heads: 14
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 2304
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-06
  rms_norm_fp32: true
  dropout: 0.0
  tie_embeddings: false
  remat: false
  attention_backend: cudnn
  attention_degree: null
  attention_normalization: true
  attention_output_scaling: none
  qk_norm: true
  qk_norm_type: rms_norm
  qk_norm_sharing: per_layer
  qk_norm_initial_scale: null
  qk_norm_eps: 1.0e-06
  initialization: transformer_truncated_reference
optim:
  learning_rate: 0.001
  min_learning_rate: 0.0001
  weight_decay: 0.1
  weight_decay_policy: exclude_embeddings_norms_biases_v1
  coefficient_penalty: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 455
  total_steps: 7570
train:
  seed: 42
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/transformer_200m_4b/unallocated
  micro_batch_size: 16
  log_every: 10
  eval_every: 500
  eval_early_every: 100
  eval_early_until: 1500
  eval_batches: 19
  ckpt_every: 500
  wandb_project: functional-memory
  wandb_entity: rafah-massachusetts-institute-of-technology
  wandb_group: transformer_200m_4b
  wandb_mode: online
