# Fixed standard-normal Hermite degree 2, normalized square factorization, 200M, seed 0.
data:
  source: packed
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  split: train
  tokenizer_name: NousResearch/Llama-2-7b-hf
  text_field: text
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  batch_size: 256
  sequence_length: 2049
  shuffle_seed: 0
  synthetic_vocab_size: 32000

model:
  kind: transformer
  vocab_size: 32000
  max_seq_len: 2048
  num_layers: 10
  hidden_size: 1024
  num_heads: 16
  num_kv_heads: 16
  qk_head_dim: 64
  value_head_dim: 64
  intermediate_size: 3008
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  dropout: 0.0
  tie_embeddings: false
  remat: false
  attention_backend: fused
  attention_degree: 2
  attention_normalization: true
  attention_coefficients: fixed
  attention_coefficient_parameterization: sum_of_squares
  # p_2(s) = exp(1/2) (s+1)^2 / 2 = [a + a*s]^2 + 0^2.
  # Fixed square factors are ascending coefficients for q_1, then q_2.
  attention_fixed_coefficients: null
  attention_fixed_square_factors: [0.9079430793557843, 0.9079430793557843, 0.0]

  qk_norm: false
optim:
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  weight_decay_policy: exclude_embeddings_norms_biases_v1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  warmup_steps: 2000
  # 19,074 * 256 * 2,048 = 10,000,269,312 prediction tokens.
  total_steps: 19074

train:
  seed: 0
  wandb_project: functional-memory
  wandb_entity: rafah-massachusetts-institute-of-technology
  wandb_group: hermite_factored_m2
  wandb_run_name: 200m-normalized-factored-m002-seed0
  wandb_dir: experiments/hermite_factored_m2/logs/200m-normalized-factored-m002-seed0/wandb
  source_commit: auto
  dtype: bfloat16
  workdir: experiments/hermite_factored_m2/runs/200m-normalized-factored-m002-seed0
  checkpoint_dir: experiments/hermite_factored_m2/checkpoints/200m-normalized-factored-m002-seed0
  micro_batch_size: 64
  log_every: 10
  eval_every: 1000
  eval_batches: 7
  ckpt_every: 500
