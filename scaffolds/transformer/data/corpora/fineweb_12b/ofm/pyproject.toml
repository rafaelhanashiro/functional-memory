[project]
name = "ofm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "flax>=0.10.0",
    "grain>=0.2.11",
    "jax>=0.4.35",
    "matplotlib>=3.9.4",
    "numpy>=2.0.0",
    "optax>=0.2.4",
    "orbax-checkpoint>=0.7.0",
    "pyyaml>=6.0.0",
    "tokenizers>=0.20.0",
    "torch>=2.8.0",
    "tqdm>=4.67.0",
    "transformers>=4.45.0",
    "tyro>=0.9.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.35"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
pythonpath = ["."]
