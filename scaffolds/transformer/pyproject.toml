[project]
name = "functional-memory-shared-transformer"
version = "0.1.0"
description = "Shared Transformer training and attention implementations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jax==0.10.0",
    "flax==0.12.7",
    "optax==0.2.8",
    "orbax-checkpoint==0.11.40",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "tqdm==4.67.3",
    "matplotlib>=3.9.4",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.10.0", "nvidia-cudnn-cu12==9.22.0.52"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "studies"]
pythonpath = ["../.."]
markers = ["gpu: requires a CUDA device"]
