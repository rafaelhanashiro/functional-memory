[project]
name = "functional-memory-shared-transformer"
version = "0.1.0"
description = "Shared Transformer training and attention implementations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jax==0.10.0",
    "flax==0.12.7",
    "optax==0.2.8",
    "orbax-checkpoint==0.11.40",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "tqdm==4.67.3",
    "matplotlib>=3.9.4",
    "wandb==0.30.0",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda12]==0.10.0", "nvidia-cudnn-cu12==9.22.0.52", "triton==3.7.1",
    # FLA's Gated DeltaNet Triton kernels, launched through the JAX bridge; the
    # CPU-only torch build only satisfies their module imports.
    "flash-linear-attention", "torch==2.9.1",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]
# Saved W&B workspace views, built by experiment analysis code.
views = ["wandb-workspaces==0.4.11"]

[tool.uv]
package = false

[tool.uv.sources]
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention.git", rev = "516143e31fce09925e6c39ac37148444bad176c4" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
markers = ["gpu: requires a CUDA device"]
