data:
  batch_size: 4
  dataset_config: sample-100BT
  dataset_name: HuggingFaceFW/fineweb-edu
  eval_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/eval/manifest.json
  sequence_length: 513
  shuffle_seed: 0
  source: synthetic
  split: train
  synthetic_vocab_size: 1024
  text_field: text
  tokenizer_name: NousResearch/Llama-2-7b-hf
  train_manifest: /data/cl/u/rafah/home/datasets/fineweb_12b/train/manifest.json
model:
  attention_backend: fused
  attention_degree: 2
  dropout: 0.0
  hidden_size: 256
  intermediate_size: 768
  kind: transformer
  max_seq_len: 512
  num_heads: 8
  num_kv_heads: 8
  num_layers: 4
  qk_head_dim: 32
  quadratic_mode: positive
  quadratic_sharing: per_head
  remat: false
  rms_norm_eps: 1.0e-06
  rope_theta: 10000.0
  tie_embeddings: false
  value_head_dim: 32
  vocab_size: 1024
optim:
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  learning_rate: 0.0003
  min_learning_rate: 3.0e-05
  total_steps: 19074
  warmup_steps: 2000
  weight_decay: 0.1
train:
  ckpt_every: 500
  dtype: bfloat16
  eval_batches: 7
  eval_every: 1000
  log_every: 10
  micro_batch_size: 4
  seed: 0
  source_commit: auto
  workdir: .cache/validation/per_head
